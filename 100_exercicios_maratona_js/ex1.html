<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex1</title>
</head>
<body>
    <script>
        let tempoSeg = Number(prompt('Digite o tempo em segundo: '))
        
        document.write(`O tempo digitado equivale a ${(tempoSeg/3600).toFixed(1)} horas <br>
        O tempo digitado equivale a ${(tempoSeg/60).toFixed(1)} minutos <br>
        O tempo digitado equivale a ${(tempoSeg).toFixed(1)} segundos`)

    </script>
</body>
</html>
