<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex76</title>
</head>
<body>
    <script>
        let frase = prompt('Frase:').split(' ')
        let palavraA = prompt('Palavra antiga:')
        let palavraN = prompt('Palavra nova:')

        function atualizar(frase, palavraA, palavraN){
            let p = 0
            for(i= 0; i<frase.length; i++){
                if(frase[i] == palavraA){
                    p = i
                }
            }
            frase[p] = palavraN

            frase = frase.join(' ')
            return frase
        }

        document.write(`${atualizar(frase, palavraA, palavraN)}`)
    </script>
</body>
</html>
