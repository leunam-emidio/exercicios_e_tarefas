<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex36</title>
</head>
<body>
    <script>
        let qtdF = parseInt(prompt('Digite a qtd de funcionarios:'))
        let med = 0
        let maior = 0
        let menor = 10000000
        for(i = 0; i<qtdF; i++){
            let nome = prompt('Digite o nome:')
            let salario = Number(prompt('Digite o salario:'))
            med+=salario

            if(salario > maior){
                maior = salario
            }

            if(salario < menor){
                menor = salario
            }
        }

        document.write(`A media é ${(med/qtdF).toFixed(2)}<br>`)
        document.write(`O maior salario é ${maior} <br>`)
        document.write(`O menor salario é ${menor}`)
    </script>
</body>
</html>
