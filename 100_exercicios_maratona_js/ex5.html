<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex5</title>
</head>
<body>
    <script>
        let a = Number(prompt('Digite valor inteiro:'))
        let op = prompt('Digite valor inteiro:')
        let b = Number(prompt('Digite valor inteiro:'))

        if(op == '+'){
            document.write('Resultado: '+a+b)
        }else if(op == '-'){
            document.write('Resultado: '+a-b)
        }else if(op == '*'){
            document.write('Resultado: '+a*b)
        }else if(op == '/'){
            document.write('Resultado: '+a/b)
        }else{
            document.write('Operador invalido ou numero errado')
        }
    </script>
</body>
</html>
