<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex98</title>
</head>
<body>
    <div id="div"></div>
    <script>
        let div = document.querySelector('#div')
        for(i = 1; i <= 20; i++){
            if(i%2==0){
                let p = document.createElement('p')
                p.innerHTML = i
                p.style.color = 'green'
                div.appendChild(p)
            }else{
                let p = document.createElement('p')
                p.innerHTML = i
                p.style.color = 'red'
                div.appendChild(p)
            }
        }
    </script>
</body>
</html>
