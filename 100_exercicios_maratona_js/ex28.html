<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex28</title>
</head>
<body>
    <script>
        let soma = 0
        let qtd = 0
        for(i = -25; i<21; i++){
            if(i>0){
                soma+=i
            }else{
                qtd++
            }
        }
        document.write(`A soma dos numeros positivos é ${soma} <br>`)
        document.write(`A media dos numeros negativos é ${qtd}`)
    </script>
</body>
</html>
