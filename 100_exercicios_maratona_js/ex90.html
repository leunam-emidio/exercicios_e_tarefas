<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex90</title>
</head>
<body>
    <script>
        let frase = prompt('Frase:').toUpperCase().split('')
        let vogais = ['A', 'E', 'I', 'O', 'U']
        for(i = 0; i<frase.length; i++){
            if(vogais.includes(frase[i])){
                frase[i] = '!'
            }
        }
        document.write(frase.join(''))
    </script>
</body>
</html>
