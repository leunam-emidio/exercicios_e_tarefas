<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex82</title>
</head>
<body>
    <label for="num">Numero:</label>
    <input type="text" id="num">
    <select name="" id="opcao">
        <option value="1">Factorial</option>
        <option value="2">par or impar</option>
        <option value="3">Primo</option>
    </select>
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="div"></div>
    <script>
        function verificar(){
            let num = document.querySelector('#num').value
            let opcao = document.querySelector('#opcao').value
            let div = document.querySelector('#div')

            div.innerHTML = ''
            num = parseInt(num)
            if(opcao == 1){
                let factorial = 1
                for(i=2; i<=num; i++){
                    factorial*=i
                }
                let p = document.createElement('p')
                p.innerHTML= factorial
                div.appendChild(p)
            }else if(opcao == 2){
                if(num%2 == 0 && num != 0){
                    let p = document.createElement('p')
                    p.innerHTML= 'par'
                    div.appendChild(p)
                }else{
                    let p = document.createElement('p')
                    p.innerHTML= 'impar'
                    div.appendChild(p)
                }
            }else{
                let d = 0
                for(i= 1; i<=num; i++){
                    if(num%i == 0){
                        d++
                    }
                }
                if(d > 2){
                    let p = document.createElement('p')
                    p.innerHTML= 'não é primo'
                    div.appendChild(p)
                }else{
                    let p = document.createElement('p')
                    p.innerHTML= 'primo'
                    div.appendChild(p)
                }
            }
        }
    </script>
</body>
</html>
