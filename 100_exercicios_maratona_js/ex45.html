<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex45</title>
</head>
<body>  
    <script>
        let qPar = 0
        let qImpar = 0

        let n = 0
        while(n!= 9999){
            n = Number(prompt('Digite um valor'))
            if(n%2==0 && n!=0){
                qPar++
            }else{
                qImpar++
            }
        }
        document.write(`A qtd de par é ${qPar}<br>`)
        document.write(`A qtd de impar é ${qImpar}`)    
    </script>
</body>
</html>
