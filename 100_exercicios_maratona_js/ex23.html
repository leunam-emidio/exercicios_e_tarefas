<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex23</title>
</head>
<body>
    <script>
        let b = parseInt(prompt('Digite a base entre 5 à 15'))
        for(let i = 1; i<=b; i++){
            if(i%2== 1){
                for(let j = 0; j<i; j++){
                    document.write('#')
                }
                document.write('<br>')
            }
        }
    </script>
</body>
</html>
