|<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex21</title>
</head>
<body>
    <script>
        let nomes = []
        for(let i=0; i<10; i++){
            let nome = prompt('Digite um nome:')
            nomes.push(nome)
        }
        let nomeC = prompt('Digite o nome a ser checado:')

        if(nomes.includes(nomeC)){
            document.write('ACHEI')
        }else{
            document.write('NÃO ACHEI')
        }
    </script>
</body>
</html>
