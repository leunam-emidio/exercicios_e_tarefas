<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex37</title>
</head>
<body>
    <script>
        let maior = 0
        let menor = 10000000
        for(i = 0; i<10; i++){
            let valor = Number(prompt('Digite o valor:'))

            if(valor > maior){
                maior = valor
            }

            if(valor < menor){
                menor = valor
            }
        }
        document.write(`O maior valor é ${maior} <br>`)
        document.write(`O menor valor é ${menor}`)
    </script>
</body>
</html>
