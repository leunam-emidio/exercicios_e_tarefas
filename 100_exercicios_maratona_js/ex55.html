<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex55</title>
</head>
<body>
    <script>
        let n = parseInt(prompt('Digite o valor de n:'))
        let r = parseInt(prompt('Digite o valor de r:'))
        let u1 = parseInt(prompt('Digite o valor de u1:'))

        document.write('A propreção Aritmetica:<br>')
        document.write(`${u1}<br>`)
        for(let i = 2; i<=n; i++){
            let un = u1 + (i-1)*r
            document.write(`${un}<br>`)
        }
    </script>
</body>
</html>
