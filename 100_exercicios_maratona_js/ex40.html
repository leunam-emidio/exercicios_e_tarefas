<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex40</title>
</head>
<body>
    <script>
        let num1 = parseInt(prompt('Digite um numero:'))
        let num2 = parseInt(prompt('Digite um numero:'))

        let soma = 0
        for(i = 0; i <num1; i++){
            soma += num2
        }
        document.write(`A multiplicação de ${num1} x ${num2} é ${soma}`)
    </script>
</body>
</html>
