<body>
    <script>
        function fibonanci(n){
            let seq = [0, 1]
            for(let i=2; i<n; i++){
                seq[i] = seq[i-1] + seq[i-2]
            }
            return seq
        }

        document.write(fibonanci(21))
    </script>
</body>
