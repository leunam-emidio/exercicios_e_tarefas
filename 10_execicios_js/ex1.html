<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex1-Manipulação de Strings</title>
</head>
<body style="background-color: burlywood;">
    <script>
        let frase = prompt('Digite uma frase:')
        document.write()
        document.write('O número de caracteres é '+frase.length+'<br>')
        let palavras = frase.split(' ')
        document.write('Existem '+palavras.length+' caracteres <br>' )
        document.write('A frase em maiscula: '+frase.toUpperCase()+'<br>')
        document.write('A frase em minuscula: '+frase.toLowerCase())
    </script>
</body>
</html>
