<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex32</title>
</head>
<body>
    <script>
        let totalGraos = 0
        let graosNaCasa = 1

        for (let i = 1; i <= 64; i++) {
            totalGraos += graosNaCasa
            graosNaCasa *= 2 
        }

        document.write(`Total de grãos recebidos: ${totalGraos}`)

    </script>
</body>
