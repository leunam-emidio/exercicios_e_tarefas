<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex51</title>
</head>
<body>
    <script>
        let soma = 0
        let q = 0
        let maior = 0
        let menor = 10000000
        let nome = ''
        while(nome != 'fim'){
            nome = prompt('Nome:')
            let salario = Number(prompt('Salario:'))
            
            soma+=salario
            q++
            if(maior<salario){
                maior= salario
            }

            if(menor>salario){
                menor= salario
            }
        }
        document.write(`Media= ${(soma/q).toFixed(2)}<br>`)
        document.write(`Maior= ${maior}<br>`)
        document.write(`Menor= ${menor}<br>`)
    </script>
</body>
</html>
