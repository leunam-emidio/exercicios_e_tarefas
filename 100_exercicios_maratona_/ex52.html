<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex52</title>
</head>
<body>
    <script>
        let n = Number(prompt('Numero:'))
        let r = n
        let d = 0

        do{
            r /= 2 
            d++
        }while(r>1)

        document.write(`O resultado: ${r}   Qtd de divisões: ${d}`)
    </script>
</body>
</html>
