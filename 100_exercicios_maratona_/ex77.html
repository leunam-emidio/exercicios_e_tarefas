<body>
    <script>
        let frase = prompt('Frase:')

        function nPalavras(frase){
            frase = frase.trim()
            frase = frase.split(' ')
            
            return frase.length
        }

        document.write(`${nPalavras(frase)}`)
    </script>
</body>
