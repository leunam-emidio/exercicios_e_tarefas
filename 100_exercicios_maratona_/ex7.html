<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex7</title>
</head>
<body>
    <script>
        let a = 0
        let b = 1
        document.write('Sequencia de Fibonanci<br>')
        document.write(a+'<br>')
        document.write(b+'<br>')
        for(let i = 2; i<15; i++){
            document.write(a+b+'<br>')
            b += a
            a=b-a
        }
    </script>
</body>
</html>
