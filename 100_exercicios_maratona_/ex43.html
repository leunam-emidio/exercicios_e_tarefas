<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex43</title>
</head>
<body>  
    <script>
        let maior = 0
        let n = 0
        while(n!= 9999){
            n = Number(prompt('Digite um valor'))
            if(maior<n && n!= 9999){
                maior=n
            }
        }
        document.write(`O maior é ${maior}`)
    </script>
</body>
</html>
