</head>
<body>
    <script>
        let verbo = prompt('Verbo regular:')
        let radical =  verbo.slice(0, verbo.length-2)
        
        document.write(`Eu ${radical}o<br>`)
        document.write(`TU ${radical}es<br>`)
        document.write(`Ele ${radical}e<br>`)
        document.write(`Ela ${radical}e<br>`)
        document.write(`Nós ${radical}emos<br>`)
        document.write(`Vós ${radical}eis<br>`)
        document.write(`Eles ${radical}em<br>`)
        document.write(`Elas ${radical}em<br>`)
    </script>
</body>
</html>
