<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex38</title>
</head>
<body>
    <script>
        let num = parseInt(prompt('Digite um valor:'))
        function fatorial(n){
            if(n == 0 || n == 1){
                return 1
            }

            return n * fatorial(n-1)
        }

        document.write(`O fatorial de ${num} é ${fatorial(num)}`)
    </script>
</body>
</html>
