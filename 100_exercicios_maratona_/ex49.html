<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex49</title>
</head>
<body>
    <script>
        let n1 = prompt('Digite o nome: ')
        let p1 = prompt('Digite o peso: ')
        let a1 = prompt('Digite o altura: ')

        let n2 = prompt('Digite o nome: ')
        let p2 = prompt('Digite o peso: ')
        let a2 = prompt('Digite o altura: ')

        if(p1>p2){
            document.write(`Mais pesada:<br> nome: ${n1} peso: ${p1}<br>`)
        }else{
            document.write(`Mais pesada:<br> nome: ${n2} peso: ${p2}<br>`)
        }

        if(a1>a2){
            document.write(`Mais alta:<br> nome: ${n1} altura: ${a1}`)
        }else{
            document.write(`Mais alta:<br> nome: ${n2} altura: ${a2}`)
        }
    </script>
</body>
</html>
