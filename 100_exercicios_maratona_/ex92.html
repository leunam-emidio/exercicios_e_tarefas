<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex92</title>
</head>
<body>
    <script>
        let sPar = 0
        let sPrimos = 0
        for(i= 0; i<10; i++){
            let num = Math.floor(Math.random()*100)
            if(num%2==0 & num != 0){
                sPar+= num
            }

            let d = 0
            for(l= 1; l<=num; l++){
                if(num%l== 0){
                    d++
                }
            }
            if(d == 2){
                sPrimos++
            }
        }

        document.write(`soma dos pares = ${sPar}<br>`)
        document.write(`soma dos primos = ${sPrimos}`)
    </script>
</body>
</html>
