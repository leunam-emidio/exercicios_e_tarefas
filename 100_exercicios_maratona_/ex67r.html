<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex67r</title>
</head>
<body>
    <script>
        let nome = prompt('Nome:').split(' ')

        nome.forEach((v, i)=> {
            if(v.length < 4 && (v[0] == 'd' || v[0] == 'e')){
                nome[i] = ''
            }else{
                nome[i] = v[0].toUpperCase()
            }
        });

        document.write(`Frase: ${nome.join('')}`)
    </script>
</body>
</html>
