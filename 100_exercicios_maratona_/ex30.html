<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex30</title>
</head>
<body>
    <script>
        let soma = 0
        for(i=31; i<85; i++){
            if(i%2== 0){
                document.write(i+'<br>')
                soma+=i
            }
        }
        document.write(`A soma dos numeros pares é ${soma}`)
    </script>
</body>
</html>
